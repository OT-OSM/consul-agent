---
consul_services:
  - name: "keycloak"
    port: 8080
    token: "{{ consul_agent_token }}"
    group: "role_keycloak"

  - name: "clickhouse"
    port: 8123
    token: "{{ consul_agent_token }}"
    group: "role_clickhouse"

  - name: "opensearch"
    port: 5601
    token: "{{ consul_agent_token }}"
    group: "role_opensearch"

  - name: "wazuh"
    port: 5601
    token: "{{ consul_agent_token }}"
    group: "role_wazuh"

  - name: "minio"
    port: 8443
    token: "{{ consul_agent_token }}"
    group: "role_minio"

  
